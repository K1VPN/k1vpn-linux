name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path daemon/Cargo.toml -- --check

      - name: Test Rust daemon
        run: cargo test --locked --manifest-path daemon/Cargo.toml

      - name: Lint Rust daemon
        run: cargo clippy --locked --manifest-path daemon/Cargo.toml -- -D warnings

      - name: Build, test and stage Snap application
        env:
          K1VPN_CLIENT_IP_KEY: ${{ github.event_name != 'pull_request' && secrets.K1VPN_CLIENT_IP_KEY || '' }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "K1VPN/k1vpn-linux" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -z "$K1VPN_CLIENT_IP_KEY" ]; then
            echo '::error::Set the repository Actions Secret K1VPN_CLIENT_IP_KEY before an official build.'
            exit 1
          fi
          npm run snap:prepare

      # React and the flag set are bundled into the renderer at build time and
      # are therefore devDependencies; audit everything.
      - name: Audit dependencies
        run: npm audit

      - name: Validate Snap launcher
        run: |
          sh -n snap/local/k1vpn-launch

      - name: Build strict Snap
        id: snapcraft
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: lxd
          SNAPCRAFT_BUILD_INFO: '1'
          SNAPCRAFT_IMAGE_INFO: '{"build_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        run: |
          runner_username="$(id -un)"

          if [ ! -x /usr/bin/snap ]; then
            sudo apt-get update -q
            sudo apt-get install -qy snapd
          fi
          if [ "$(stat -c '%u:%g' /)" != '0:0' ]; then
            sudo chown root:root /
          fi

          if [ -x /usr/bin/lxd ]; then
            sudo apt-get remove -qy lxd lxd-client
          fi
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$runner_username"
          if [ -x /snap/bin/lxd ]; then
            sudo snap refresh lxd || true
          else
            sudo snap install lxd
          fi
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT

          if [ -x /snap/bin/snapcraft ]; then
            sudo snap refresh --channel stable --classic snapcraft
          else
            sudo snap install --channel stable --classic snapcraft
          fi
          sudo -u "$runner_username" -E snapcraft

          snap_file="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.snap' -print -quit)"
          test -n "$snap_file"
          echo "snap=$snap_file" >> "$GITHUB_OUTPUT"

      - name: Inspect Snap contents
        run: |
          sudo apt-get install -y squashfs-tools
          node scripts/inspect-snap.mjs '${{ steps.snapcraft.outputs.snap }}'

      - name: Upload Snap package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k1vpn-linux-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 14
