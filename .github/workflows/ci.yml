name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path daemon/Cargo.toml -- --check

      - name: Test Rust daemon
        run: cargo test --locked --manifest-path daemon/Cargo.toml

      - name: Lint Rust daemon
        run: cargo clippy --locked --manifest-path daemon/Cargo.toml -- -D warnings

      - name: Build, test and stage Snap application
        env:
          K1VPN_CLIENT_IP_KEY: ${{ github.event_name != 'pull_request' && secrets.K1VPN_CLIENT_IP_KEY || '' }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "K1VPN/k1vpn-linux" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -z "$K1VPN_CLIENT_IP_KEY" ]; then
            echo '::error::Set the repository Actions Secret K1VPN_CLIENT_IP_KEY before an official build.'
            exit 1
          fi
          npm run snap:prepare

      # React and the flag set are bundled into the renderer at build time and
      # are therefore devDependencies; audit everything.
      - name: Audit dependencies
        run: npm audit

      - name: Validate Snap launcher
        run: |
          sh -n snap/local/k1vpn-launch

      - name: Build strict Snap
        id: snapcraft
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Inspect Snap contents
        run: |
          sudo apt-get install -y squashfs-tools
          node scripts/inspect-snap.mjs '${{ steps.snapcraft.outputs.snap }}'

      - name: Upload Snap package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k1vpn-linux-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 14
