[package]
name = "k1vpnd"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
nix = { version = "0.31.3", features = ["net", "socket", "user", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "6.1.0", default-features = false, features = ["default-rt", "proxy"] }
zeroize = { version = "1.9.1", features = ["derive"] }
